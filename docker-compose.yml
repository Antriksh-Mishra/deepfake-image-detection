version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=sqlite:///./deepfake.db
      - MODEL_NAME=resnet50
      - MODEL_PATH=/app/ml/models/best_model.pth
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./ml/models:/app/ml/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
