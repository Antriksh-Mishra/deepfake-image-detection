[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-forensic-sentinel"
version = "1.0.0"
description = "Dual-Domain Deepfake Image & Frame-Level Video Detection and Explainability Suite"
authors = [{ name = "Antriksh Mishra" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "timm>=0.9.12",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "streamlit>=1.31.0",
    "reportlab>=4.1.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
